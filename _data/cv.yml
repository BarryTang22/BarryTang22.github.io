          - "Continual and multi-task learning for streaming sensor signals, improving robustness to distribution shift while reducing compute and memory."
          - "Led transformer-based pipeline optimisation: profiling-driven performance tuning and memory-efficiency for resource-constrained platforms."
          - "Built end-to-end data pipelines (ingestion, preprocessing, experiment tracking, reproducible runs) for reliable comparison across datasets."

