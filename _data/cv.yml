  summary: >-
    Assistant Professor (Lecturer) in Artificial Intelligence at the University of Bristol, working on
    efficient and applied AI for multimodal and time-series data. I develop robust, resource-aware deep
    learning that combines signal processing with foundation models and vision-language models, with 30+
    peer-reviewed papers (650+ citations) including at NeurIPS and ICLR.

